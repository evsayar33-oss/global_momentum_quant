name: GMQ Momentum Entry Timing / Chase Avoidance V4 — Start Alignment Fix

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Historical years"
        required: false
        default: "14"
      start:
        description: "Research evaluation start"
        required: false
        default: "2018-01-01"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gmq_momentum_entry_timing_requirements.txt
      - name: Align helper and backtest start dates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("gmq_momentum_entry_timing_chase_avoidance_v4.py")
          s = p.read_text(encoding="utf-8")
          wrong = "import gmq_tail_risk_alpha_conditional_sizing as mod"
          right = "import gmq_early_adverse_predictor as mod"
          if wrong in s:
              s = s.replace(wrong, right)
          if right not in s:
              raise SystemExit("Unexpected helper loader; stopping safely.")
          old_run = "runs = run_engine_backtest(md_b, md_u, fx, start, last_date, PRIMARY_COST_RT, run_lookups, C.CAPITAL_TL)"
          new_run = "runs = run_engine_backtest(md_b, md_u, fx, start_full, last_date, PRIMARY_COST_RT, run_lookups, C.CAPITAL_TL)"
          old_base = "base_rerun = run_engine_backtest(md_b, md_u, fx, start, last_date, PRIMARY_COST_RT, None, C.CAPITAL_TL)"
          new_base = "base_rerun = run_engine_backtest(md_b, md_u, fx, start_full, last_date, PRIMARY_COST_RT, None, C.CAPITAL_TL)"
          if old_run in s:
              s = s.replace(old_run, new_run, 1)
          elif new_run not in s:
              raise SystemExit("Policy backtest call did not match expected source.")
          if old_base in s:
              s = s.replace(old_base, new_base, 1)
          elif new_base not in s:
              raise SystemExit("BASE backtest call did not match expected source.")
          anchor = '    runs["BASE"] = (base_state, base_daily, pd.DataFrame())'
          addition = anchor + "\n\n    # Shared warm-up simulation; score only the requested evaluation window.\n    for _name, (_st, _daily, _audit) in list(runs.items()):\n        runs[_name] = (_st, _daily.loc[_daily.index >= start].copy(), _audit)\n    base_daily = runs[\"BASE\"][1]"
          if addition not in s:
              if anchor not in s:
                  raise SystemExit("Could not find BASE assignment for evaluation-window trim.")
              s = s.replace(anchor, addition, 1)
          p.write_text(s, encoding="utf-8")
          print("PATCH OK: helper import and shared simulation start")
          PY
          python -m py_compile gmq_momentum_entry_timing_chase_avoidance_v4.py
      - name: Synthetic smoke
        run: |
          python gmq_momentum_entry_timing_chase_avoidance_v4.py --synthetic --out research/smoke_momentum_entry_timing_chase_avoidance_v4
      - name: Verify dependencies
        run: |
          test -f gmq_tail_risk_alpha_conditional_sizing.py
          test -f gmq_early_adverse_predictor.py
          test -f engine.py
          test -f portfolio.py
          test -f data.py
          test -f config.py
      - name: Run execution-verified research
        env:
          YFINANCE_CACHE_DIR: ${{ github.workspace }}/.yfinance-cache
        run: |
          python gmq_momentum_entry_timing_chase_avoidance_v4.py --years "${{ inputs.years || '14' }}" --start "${{ inputs.start || '2018-01-01' }}" --out research/results_momentum_entry_timing_chase_avoidance_v4
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmq-momentum-entry-timing-chase-avoidance-v4-alignment-results
          path: |
            research/results_momentum_entry_timing_chase_avoidance_v4/
            research/smoke_momentum_entry_timing_chase_avoidance_v4/
          if-no-files-found: warn
          retention-days: 30
