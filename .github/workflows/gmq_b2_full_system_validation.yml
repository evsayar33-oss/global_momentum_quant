name: Global Momentum Quant - B2 Full System Final Validation

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Veri yılı. 14 = yaklaşık 13 yıllık ölçüm + warm-up.'
        required: true
        default: '14'
      costs:
        description: 'Round-trip maliyet stres seviyeleri (%)'
        required: true
        default: '0.35,0.50,0.75,1.00,1.25'

permissions:
  contents: read

jobs:
  b2-final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: Python sözdizimi kontrolü
        run: |
          python -m py_compile gmq_b2_full_system_validation.py

      - name: B2 full-system final validation
        env:
          YEARS: ${{ inputs.years }}
          COSTS: ${{ inputs.costs }}
        run: |
          python gmq_b2_full_system_validation.py \
            --years "$YEARS" \
            --costs "$COSTS" \
            --out b2_full_system_validation_raporu.md \
            --trades-out b2_full_system_validation_islemler.csv

      - name: Final raporu Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: gmq-b2-full-system-final-validation
          path: |
            b2_full_system_validation_raporu.md
            b2_full_system_validation_islemler.csv
          if-no-files-found: error
          retention-days: 30
