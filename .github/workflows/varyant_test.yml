name: Global Momentum Quant - Varyant Test

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'İndirilecek veri yılı. 14 = yaklaşık 13 yıllık ölçüm + warm-up.'
        required: true
        default: '14'

permissions:
  contents: read

jobs:
  variant-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 13 yıllık karşılaştırmalı varyant testi
        env:
          YEARS: ${{ inputs.years }}
        run: |
          python varyant_test.py --years "$YEARS" --out varyant_raporu.md

      - name: Raporu Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: gmq-varyant-raporu
          path: varyant_raporu.md
          if-no-files-found: error
          retention-days: 30
