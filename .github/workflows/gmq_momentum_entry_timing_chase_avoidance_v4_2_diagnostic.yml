name: GMQ Momentum Entry Timing / Chase Avoidance V4.2 — Diagnostic Only

on:
  workflow_dispatch:
    inputs:
      fetch_latest_artifacts:
        description: "Read the latest successful V2, V3 and V4.1 research artifacts"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install existing research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gmq_momentum_entry_timing_requirements.txt

      - name: Compile V4.2 diagnostic
        run: python -m py_compile gmq_momentum_entry_timing_chase_avoidance_v4_2_diagnostic.py

      - name: Synthetic self-test
        run: python gmq_momentum_entry_timing_chase_avoidance_v4_2_diagnostic.py --self-test

      - name: Audit prior research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.fetch_latest_artifacts }}" = "true" ]; then
            python gmq_momentum_entry_timing_chase_avoidance_v4_2_diagnostic.py \
              --fetch-latest-artifacts \
              --out research/results_momentum_entry_timing_chase_avoidance_v4_2_diagnostic
          else
            python gmq_momentum_entry_timing_chase_avoidance_v4_2_diagnostic.py \
              --out research/results_momentum_entry_timing_chase_avoidance_v4_2_diagnostic
          fi

      - name: Upload V4.2 diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmq-momentum-entry-timing-chase-avoidance-v4-2-diagnostic-only
          path: research/results_momentum_entry_timing_chase_avoidance_v4_2_diagnostic/
          if-no-files-found: warn
          retention-days: 30
