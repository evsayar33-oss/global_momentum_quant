name: Global Momentum Quant - B2 Robust Regime Test

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Ham veri yılı. 14 = yaklaşık 13 yıllık ölçüm + warm-up.'
        required: true
        default: '14'
      costs:
        description: 'Round-trip maliyet stres seviyeleri (%)'
        required: true
        default: '0.35,0.50,0.75,1.00,1.25'

permissions:
  contents: read

jobs:
  b2-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: B2 sentetik smoke test
        run: |
          python b2_robust_regime_test.py --synthetic

      - name: B2 gerçek veri testi
        env:
          YEARS: ${{ inputs.years }}
          COSTS: ${{ inputs.costs }}
        run: |
          python b2_robust_regime_test.py \
            --years "$YEARS" \
            --costs "$COSTS" \
            --out b2_robust_regime_raporu.md \
            --trades-out b2_robust_regime_islemler.csv

      - name: Rapor ve işlemleri Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: gmq-b2-robust-regime-raporu
          path: |
            b2_robust_regime_raporu.md
            b2_robust_regime_islemler.csv
          if-no-files-found: error
          retention-days: 30
