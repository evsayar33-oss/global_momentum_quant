name: Global Momentum Quant - Early-Adverse Predictor (Hardened v2)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Veri yılı"
        required: true
        default: "14"
        type: string
      cost:
        description: "Round-trip maliyet (%)"
        required: true
        default: "0.35"
        type: string

permissions:
  contents: read

concurrency:
  group: gmq-early-adverse-predictor-hardened-v2
  cancel-in-progress: false

jobs:
  early-adverse-predictor:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Veri bilimi bağımlılıklarını sabitle
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Reproducible research versions:
          # requirements.txt currently allows newer yfinance releases.
          pip install --upgrade --force-reinstall "yfinance==0.2.66" "scikit-learn==1.7.2"
          pip install tabulate
          pip check

      - name: Sürüm ve sözdizimi kontrolü
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile gmq_early_adverse_predictor.py
          python -m py_compile gmq_early_adverse_predictor_hardened_runner.py
          python - <<'PY'
          import numpy, pandas, yfinance, sklearn
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("yfinance", yfinance.__version__)
          print("scikit-learn", sklearn.__version__)
          PY

      - name: Synthetic smoke test
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf smoke_test_output
          python -X faulthandler gmq_early_adverse_predictor.py \
            --synthetic \
            --out-dir smoke_test_output

      - name: Early-Adverse Predictor - gerçek araştırma
        shell: bash
        env:
          YEARS: ${{ inputs.years }}
          COST: ${{ inputs.cost }}
          OUT_DIR: gmq_early_adverse_predictor_output
        run: |
          set -euxo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python -X faulthandler gmq_early_adverse_predictor_hardened_runner.py

      - name: Araştırma çıktıları artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gmq-early-adverse-predictor-hardened-v2
          if-no-files-found: error
          retention-days: 30
          path: |
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_raporu.md
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_trades.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_model.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_holdout.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_buckets.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_filter_scenarios.csv
