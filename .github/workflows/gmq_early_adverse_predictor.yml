name: Global Momentum Quant - Early-Adverse Predictor (Fixed v5)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Veri yılı"
        required: true
        default: "14"
        type: string
      cost:
        description: "Round-trip maliyet (%)"
        required: true
        default: "0.35"
        type: string

permissions:
  contents: read

concurrency:
  group: gmq-early-adverse-predictor-fixed-v5
  cancel-in-progress: false

jobs:
  early-adverse-predictor:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Uyumlu araştırma ortamını kur
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade --force-reinstall \
            "pandas==2.3.3" \
            "numpy==2.2.6" \
            "yfinance==0.2.66" \
            "scikit-learn==1.7.2" \
            "tabulate"
          pip check

      - name: Syntax ve f-string regression kontrolü
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile gmq_early_adverse_predictor.py
          python -m py_compile gmq_early_adverse_predictor_hardened_runner.py

          python - <<'PY'
          from pathlib import Path
          import numpy, pandas, yfinance, sklearn

          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("yfinance", yfinance.__version__)
          print("scikit-learn", sklearn.__version__)

          source = Path("gmq_early_adverse_predictor.py").read_text(encoding="utf-8")

          assert 'pm_tr = preds[preds["sample"] == "train"].copy()' in source
          assert 'pm_ho = preds[preds["sample"] == "holdout"].copy()' in source
          assert 'trades["early_adverse"]' in source
          assert 'print(f"Trades={len(trades)} | EarlyAdverse={early_adverse_pct:.2f}%")' in source

          # Regression guard for the exact v4 syntax failure.
          assert 'print(f"Trades={len(trades)} | EarlyAdverse={trades["early_adverse"]' not in source

          print("Syntax/f-string regression PASS")
          PY

      - name: Yahoo veri bağlantı preflight
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import yfinance as yf

          checks = {
              "BIST": ["THYAO.IS", "BIMAS.IS"],
              "US": ["AAPL", "MSFT"],
              "FX": ["TRY=X"],
              "IRX": ["^IRX"],
          }

          for group, symbols in checks.items():
              print(f"--- {group} ---")
              d = yf.download(
                  symbols,
                  period="5d",
                  interval="1d",
                  auto_adjust=False,
                  progress=False,
                  threads=False,
              )
              print("rows:", 0 if d is None else len(d))
              if d is None or d.empty:
                  raise RuntimeError(f"Yahoo preflight boş: {group}")

          print("Yahoo veri bağlantı preflight PASS")
          PY

      - name: Synthetic smoke test
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf smoke_test_output
          python -X faulthandler gmq_early_adverse_predictor.py \
            --synthetic \
            --out-dir smoke_test_output

      - name: Early-Adverse Predictor - gerçek araştırma
        shell: bash
        env:
          YEARS: ${{ inputs.years }}
          COST: ${{ inputs.cost }}
          OUT_DIR: gmq_early_adverse_predictor_output
        run: |
          set -euxo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python -X faulthandler gmq_early_adverse_predictor_hardened_runner.py

      - name: Başarısız araştırmada debug özeti
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "=== DEBUG DIRECTORY ==="
          pwd
          echo "=== DATA CACHE ==="
          if [ -d data_cache ]; then
            du -sh data_cache || true
            find data_cache -maxdepth 2 -type f -printf '%p %k KB\n' | head -50 || true
          else
            echo "data_cache yok"
          fi
          echo "=== OUTPUT DIRECTORY ==="
          if [ -d gmq_early_adverse_predictor_output ]; then
            find gmq_early_adverse_predictor_output -maxdepth 1 -type f -printf '%p %k KB\n' || true
          fi

      - name: Araştırma çıktıları artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gmq-early-adverse-predictor-fixed-v5
          if-no-files-found: error
          retention-days: 30
          path: |
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_raporu.md
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_trades.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_model.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_holdout.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_buckets.csv
            gmq_early_adverse_predictor_output/gmq_early_adverse_predictor_filter_scenarios.csv
