name: Global Momentum Quant - Adaptive Risk V2 Research

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Veri yılı. 14 = yaklaşık 13+ yıllık ölçüm + warm-up."
        required: true
        default: "14"
      costs:
        description: "Round-trip maliyet stres seviyeleri (%)"
        required: true
        default: "0.35,0.50,0.75,1.00,1.25"

permissions:
  contents: read

concurrency:
  group: gmq-adaptive-risk-v2
  cancel-in-progress: false

jobs:
  adaptive-risk-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Veri cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: gmq-adaptive-risk-v2-${{ runner.os }}
          restore-keys: |
            gmq-adaptive-risk-v2-${{ runner.os }}-

      - name: Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sözdizimi kontrolü
        run: python -m py_compile gmq_adaptive_risk_v2.py

      - name: Adaptive Risk V2 araştırması
        env:
          YEARS: ${{ inputs.years }}
          COSTS: ${{ inputs.costs }}
        run: |
          python gmq_adaptive_risk_v2.py \
            --years "$YEARS" \
            --costs "$COSTS" \
            --out gmq_adaptive_risk_v2_raporu.md

      - name: Raporu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: gmq-adaptive-risk-v2-research
          path: gmq_adaptive_risk_v2_raporu.md
          if-no-files-found: error
          retention-days: 30
