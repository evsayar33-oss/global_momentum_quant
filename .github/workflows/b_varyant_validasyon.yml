name: Global Momentum Quant - B Varyant Bağımsız Doğrulama

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'İndirilecek veri yılı. 14 = yaklaşık 13 yıllık ölçüm + warm-up.'
        required: true
        default: '14'
      costs:
        description: 'Round-trip maliyet stres seviyeleri (%)'
        required: true
        default: '0.35,0.50,0.75,1.00,1.25'

permissions:
  contents: read

jobs:
  validate-b-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: B varyantı sentetik smoke test
        run: |
          python b_varyant_validasyon.py --synthetic

      - name: Bağımsız ikinci doğrulama
        env:
          YEARS: ${{ inputs.years }}
          COSTS: ${{ inputs.costs }}
        run: |
          python b_varyant_validasyon.py \
            --years "$YEARS" \
            --costs "$COSTS" \
            --out b_varyant_validasyon_raporu.md \
            --trades-out b_varyant_validasyon_islemler.csv

      - name: Rapor ve denetim verisini Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: gmq-b-varyant-bagimsiz-dogrulama
          path: |
            b_varyant_validasyon_raporu.md
            b_varyant_validasyon_islemler.csv
          if-no-files-found: error
          retention-days: 30
