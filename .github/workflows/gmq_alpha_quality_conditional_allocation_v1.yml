name: GMQ Alpha-Quality Conditional Allocation V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gmq_alpha_quality_requirements.txt

      - name: Validate syntax
        run: |
          python -m py_compile gmq_alpha_quality_conditional_allocation_v1.py
          python -m py_compile gmq_tail_risk_alpha_conditional_sizing.py

      - name: Synthetic smoke test
        run: |
          python gmq_alpha_quality_conditional_allocation_v1.py --synthetic

      - name: Run production-path OOS research
        run: |
          python gmq_alpha_quality_conditional_allocation_v1.py --years 14

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmq-alpha-quality-conditional-allocation-v1-results
          path: research/results_alpha_quality_conditional_allocation_v1/
          if-no-files-found: error
